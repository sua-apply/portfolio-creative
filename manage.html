<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>관리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root { --bg: #f4f1ea; --card: #fff; --line: #d6d0c3; --ink: #161513; --soft: #5c5850; --accent: #ff4f1f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font: 15px/1.6 "Pretendard", system-ui, sans-serif; }
    [hidden] { display: none !important; }
    main { width: min(820px, 100%); }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p { margin: 0; color: var(--soft); }
    form, .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px; }
    form { max-width: 380px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    label { font-size: 13px; color: var(--soft); }
    input { min-height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: var(--bg); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button, .row a { min-height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); font: inherit; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
    button:hover, .row a:hover { border-color: var(--ink); }
    .primary { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
    .err { color: #c0262d; font-size: 14px; }
    .panel { display: flex; flex-direction: column; gap: 22px; }
    .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
    .row { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .row code { font-size: 13px; color: var(--accent); overflow-wrap: anywhere; }
    .row div:last-child { display: flex; gap: 8px; }
    .mode { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 16px; border-radius: 12px; background: var(--bg); }
    .note { font-size: 13px; }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; gap: 8px; } }
  </style>
</head>
<body>
  <main>
    <form id="gate" autocomplete="off">
      <h1>관리</h1>
      <p>비밀번호를 입력하세요.</p>
      <label for="pw">비밀번호</label>
      <input id="pw" type="password" required />
      <p class="err" id="err" hidden>비밀번호가 맞지 않아요.</p>
      <button class="primary" type="submit">들어가기</button>
    </form>

    <section class="panel" id="panel" hidden>
      <div class="head">
        <div>
          <h1>CREATIVE 직무별 링크</h1>
          <p>지원할 직무의 링크를 복사해서 보내세요. 방문자에게는 그 직무만 보여요.</p>
        </div>
        <button type="button" id="logout">나가기</button>
      </div>
      <ul id="rows"></ul>
      <div class="mode">
        <div><strong>관리자 모드</strong><p class="note" id="modeState"></p></div>
        <button type="button" id="mode"></button>
      </div>
      <p class="note">링크 코드는 Supabase → Table Editor → schema <b>portfolio</b> → <b>roles</b> 표의 code 칸이에요. 이 페이지 주소는 사이트 어디에도 연결되어 있지 않아요.</p>
    </section>
  </main>

  <script src="js/db.js?v=20261008f"></script>
  <script>
    (function () {
      "use strict";
      // 비밀번호는 DB에서만 확인해요 (이 파일에는 비밀번호도, 링크 코드도 없어요)
      var TRACK = "creative";
      var ADMIN = "pf-admin-mode", LINKS = "pf-admin-links", SESSION = "pf-admin-session";
      var $ = function (s) { return document.querySelector(s); };
      var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
      var get = function (st, k) { try { return st.getItem(k); } catch (e) { return null; } };
      var isAdmin = function () { return get(localStorage, ADMIN) === "1"; };
      var links = null;

      function sync() {
        var on = isAdmin();
        $("#mode").textContent = on ? "관리자 모드 끄기" : "관리자 모드 켜기";
        $("#modeState").textContent = on
          ? "켜짐 · 이 브라우저에서 사이트를 열면 오른쪽 아래에 직무 전환 막대가 보여요."
          : "꺼짐 · 방문자와 똑같은 화면이에요.";
      }
      function show() {
        $("#gate").hidden = true;
        $("#panel").hidden = false;
        var base = new URL("./", location.href);
        $("#rows").innerHTML = links.filter(function (l) { return l.track === TRACK; }).map(function (l) {
          var url = new URL("index.html?v=" + encodeURIComponent(l.code), base).href;
          return '<li class="row"><strong>' + esc(l.label) + (l.is_default ? ' <small>(기본)</small>' : '') + '</strong><code>' + esc(url) + '</code>' +
            '<div><button type="button" data-copy="' + esc(url) + '">복사</button><a href="' + esc(url) + '" target="_blank" rel="noopener">열기</a></div></li>';
        }).join("");
        sync();
      }
      $("#gate").addEventListener("submit", function (e) {
        e.preventDefault();
        var btn = $("#gate button"), err = $("#err");
        btn.disabled = true; btn.textContent = "확인 중…";
        window.rpc("admin_role_links", { p_password: $("#pw").value }).then(function (res) {
          if (!res || !res.ok) {
            err.textContent = res && res.reason === "locked" ? "너무 많이 틀렸어요. 15분 뒤에 다시 해주세요." : "비밀번호가 맞지 않아요.";
            err.hidden = false; $("#pw").select(); return;
          }
          links = res.links || [];
          sessionStorage.setItem(SESSION, JSON.stringify(links));
          if (isAdmin()) localStorage.setItem(LINKS, JSON.stringify(links));
          $("#pw").value = "";
          show();
        }).catch(function () {
          err.textContent = "DB에 연결하지 못했어요. 잠시 후 다시 해주세요."; err.hidden = false;
        }).then(function () { btn.disabled = false; btn.textContent = "들어가기"; });
      });
      $("#pw").addEventListener("input", function () { $("#err").hidden = true; });
      $("#rows").addEventListener("click", function (e) {
        var b = e.target.closest("button[data-copy]");
        if (!b) return;
        navigator.clipboard.writeText(b.dataset.copy).then(function () { b.textContent = "복사됨"; }, function () { b.textContent = "복사 실패"; });
        setTimeout(function () { b.textContent = "복사"; }, 1400);
      });
      // 관리자 모드를 켜면 이 브라우저에만 링크 목록을 저장해서 직무 전환 막대에 써요
      $("#mode").addEventListener("click", function () {
        if (isAdmin()) { localStorage.removeItem(ADMIN); localStorage.removeItem(LINKS); }
        else { localStorage.setItem(ADMIN, "1"); localStorage.setItem(LINKS, JSON.stringify(links)); }
        sync();
      });
      $("#logout").addEventListener("click", function () {
        sessionStorage.removeItem(SESSION);
        localStorage.removeItem(ADMIN);
        localStorage.removeItem(LINKS);
        location.reload();
      });
      try { links = JSON.parse(get(sessionStorage, SESSION) || "null"); } catch (e) { links = null; }
      if (Array.isArray(links)) show(); else $("#pw").focus();
    })();
  </script>
</body>
</html>
