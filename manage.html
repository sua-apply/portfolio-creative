<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>관리</title>
  <style>
    :root { --bg: #fffdf8; --tile: #ffffff; --line: #ebe5d9; --text: #1d1b18; --muted: #6e685c; --accent: #ff5b2e; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; display: grid; place-items: center; padding: 24px; }
    [hidden] { display: none !important; }
    main { width: min(820px, 100%); }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { margin: 0; color: var(--muted); }
    form, .panel { background: var(--tile); border: 1px solid var(--line); border-radius: 18px; padding: 28px; }
    form { max-width: 380px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    label { font-size: 13px; color: var(--muted); }
    input { min-height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: #fffdf8; color: var(--text); font: inherit; }
    input:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button, .row a { min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
    button:hover, .row a:hover { border-color: var(--accent); }
    .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; justify-content: center; }
    .err { color: #c0262d; font-size: 14px; }
    .panel { display: flex; flex-direction: column; gap: 22px; }
    .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .row { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .row__name { display: flex; flex-direction: column; }
    .row__name span { font-size: 12px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
    .row__url { font-size: 13px; color: var(--accent); overflow-wrap: anywhere; }
    .row__actions { display: flex; gap: 8px; }
    .mode { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px; border-radius: 12px; background: #fff1ea; flex-wrap: wrap; }
    .note { font-size: 13px; }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; gap: 8px; } }
  </style>
</head>
<body>
  <main>
    <form id="gate" autocomplete="off">
      <h1>관리</h1>
      <p>비밀번호를 입력하세요.</p>
      <label for="pw">비밀번호</label>
      <input id="pw" type="password" required>
      <p class="err" id="err" hidden>비밀번호가 맞지 않아요.</p>
      <button class="primary" type="submit">들어가기</button>
    </form>

    <section class="panel" id="panel" hidden>
      <div class="head">
        <div>
          <h1>CREATIVE 직무별 링크</h1>
          <p>지원할 직무의 링크를 복사해서 보내세요. 방문자에게는 그 직무만 보여요.</p>
        </div>
        <button type="button" id="logout">나가기</button>
      </div>
      <ul id="rows"></ul>
      <div class="mode">
        <div>
          <strong>관리자 모드</strong>
          <p class="note" id="mode-state"></p>
        </div>
        <button type="button" id="mode"></button>
      </div>
      <p class="note">링크 코드는 assets/js/data.js 의 code 값이에요. 이 페이지 주소는 어디에도 연결되어 있지 않아요.</p>
    </section>
  </main>
  <script type="module" src="assets/js/manage.js"></script>
</body>
</html>
